name: Deploy infra (agent Static Web App)

on:
  push:
    branches: ['main']
    paths:
      - 'infra/agent-web/azuredeploy.json'
      - 'infra/agent-web/azuredeploy.parameters.json'
      - '.github/workflows/deploy-infra-agent-web.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      RESOURCE_GROUP: f1-fantazy-bot
      DEPLOYMENT_SUFFIX: ${{ github.run_id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_A26EA2FA0FAC46F99530B8845D983E85 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_8FDB1A8936224E90A898EAC192094784 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_00873174CBBD48D3871911006820901C }}

      - name: Deploy agent Static Web App ARM template
        run: npm run deploy:agent-web
