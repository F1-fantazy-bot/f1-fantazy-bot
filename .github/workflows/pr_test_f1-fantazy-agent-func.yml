# Code deploy for the f1-fantazy-agent-func Function App TEST slot.
# Pull requests against main land here. The agent package EXCLUDES
# `telegramWebhook/` and other non-agent paths so an agent PR cannot
# affect the Telegram bot.

name: Build and deploy Node.js project to Azure Function App - f1-fantazy-agent-func (test slot)

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
    paths:
      - 'src/**'
      - 'agentWebhook/**'
      - 'package.json'
      - 'package-lock.json'
      - 'host.json'
      - '.funcignore.agent'
      - '.github/workflows/pr_test_f1-fantazy-agent-func.yml'

env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: '.'
  NODE_VERSION: '22.x'
  COMMIT_ID: ${{ github.event.pull_request.head.sha }}
  COMMIT_MESSAGE: ${{ github.event.pull_request.title }}
  COMMIT_LINK: ${{ github.event.pull_request.html_url }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }} Environment
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 'npm i + npm run lint + npm run test:coverage'
        shell: bash
        run: |
          pushd './${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}'
          npm install
          npm run lint
          npm run test:coverage
          popd

      - name: Write version information
        run: |
          echo "COMMIT_ID=$COMMIT_ID" >> .env
          echo "COMMIT_MESSAGE=$COMMIT_MESSAGE" >> .env
          echo "COMMIT_LINK=$COMMIT_LINK" >> .env

      - name: Upload test-slot configuration script
        uses: actions/upload-artifact@v4
        with:
          name: agent-test-slot-config
          path: infra/agent-func/apply-settings.sh

      - name: Strip non-agent paths from the package
        shell: bash
        run: |
          rm -rf telegramWebhook/ web/ infra/ scripts/ docs/ .github/ coverage/ .husky/ .vscode/
          rm -f AGENTS.md readme.md jest.config.js eslint.config.mjs .eslintignore .prettierrc local.settings.json
          cp .funcignore.agent .funcignore
          test -f agentWebhook/function.json
          test -f agentWebhook/index.js
          test -f src/agent/runtime.js
          test ! -d telegramWebhook

      - name: Zip artifact for deployment
        run: zip release.zip ./* .funcignore -r

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: agent-node-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: agent-node-app

      - name: Unzip artifact for deployment
        run: unzip release.zip

      - name: Download test-slot configuration script
        uses: actions/download-artifact@v4
        with:
          name: agent-test-slot-config
          path: agent-test-slot-config

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_A26EA2FA0FAC46F99530B8845D983E85 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_8FDB1A8936224E90A898EAC192094784 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_00873174CBBD48D3871911006820901C }}

      - name: Check function app state (test slot)
        id: state_check
        # When the slot is Stopped, the Sync Trigger step inside Azure/functions-action
        # below fails (the runtime isn't listening). The upload + WEBSITE_RUN_FROM_PACKAGE
        # update still succeed BEFORE that failure, so the latest code is queued for the
        # next `az functionapp start --slot test`. We tolerate the sync-trigger failure
        # ONLY when the slot is Stopped — see continue-on-error on the action.
        run: |
          STATE=$(az functionapp show --name f1-fantazy-agent-func --slot test --resource-group f1-fantazy-bot --query state -o tsv)
          echo "Test slot state: $STATE"
          echo "state=$STATE" >> "$GITHUB_OUTPUT"
          if [ "$STATE" = "Stopped" ]; then
            echo "::warning::Test slot is Stopped. Code will upload + WEBSITE_RUN_FROM_PACKAGE will update, but Sync Trigger will fail (cosmetic). The latest code will load automatically on the next \`az functionapp start --slot test\`."
          fi

      - name: 'Run Azure Functions Action'
        uses: Azure/functions-action@v1
        id: fa
        # See state_check note for why this tolerates failure when the slot is Stopped.
        continue-on-error: ${{ steps.state_check.outputs.state == 'Stopped' }}
        with:
          app-name: 'f1-fantazy-agent-func'
          slot-name: 'test'
          package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}

      - name: 'Set Function App Environment Variables'
        uses: azure/appservice-settings@v1
        with:
          app-name: 'f1-fantazy-agent-func'
          slot-name: 'test'
          mask-inputs: false
          app-settings-json: |
            [
              { "name": "COMMIT_ID",
                "value": ${{ toJSON(env.COMMIT_ID) }},
                "slotSetting": false },

              { "name": "COMMIT_MESSAGE",
                "value": ${{ toJSON(env.COMMIT_MESSAGE) }},
                "slotSetting": false },

              { "name": "COMMIT_LINK",
                "value": ${{ toJSON(env.COMMIT_LINK) }},
                "slotSetting": false }
            ]

      - name: Configure test-slot billing access
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_00873174CBBD48D3871911006820901C }}
          GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          AGENT_SETTINGS_SLOT: test
        run: bash agent-test-slot-config/apply-settings.sh
