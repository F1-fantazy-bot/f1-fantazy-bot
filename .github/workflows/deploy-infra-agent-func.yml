name: Deploy infra (agent Function App)

on:
  push:
    branches: ['main']
    paths:
      - 'infra/agent-func/azuredeploy.json'
      - 'infra/agent-func/azuredeploy.parameters.json'
      - 'infra/agent-func/apply-settings.sh'
      - '.github/workflows/deploy-infra-agent-func.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      RESOURCE_GROUP: f1-fantazy-bot
      DEPLOYMENT_SUFFIX: ${{ github.run_id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_A26EA2FA0FAC46F99530B8845D983E85 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_8FDB1A8936224E90A898EAC192094784 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_00873174CBBD48D3871911006820901C }}

      - name: Deploy agent Function App ARM template
        env:
          # Public OAuth client id, kept in a secret only to avoid
          # hard-coding environment-specific config in the workflow.
          # apply-settings.sh uses this for the backend GOOGLE_CLIENT_ID
          # gate; without it, an infra deploy would preserve the existing
          # value rather than clearing auth.
          GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: npm run deploy:agent-func
